---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: opentelemetry-operator-e2e-tests-fbc
spec:
  description: |
    End-to-end tests of the Red Hat build of OpenTelemetry for an ART FBC build. The pipeline runs when ART has
    built the FBC fragment (ART builds it after the operator, collector and target allocator images are in the
    stage registry). It does nothing when the fragment is for another OCP version than `ocp_version`, so one
    IntegrationTestScenario per OCP version can run on every FBC build.

    The pipeline creates an ephemeral OpenShift CI HyperShift cluster of `ocp_version`, adds the stage registry
    credentials and a mirror from registry.redhat.io/rhosdt to registry.stage.redhat.io/rhosdt, installs the operator
    from the FBC (CatalogSource and Subscription) and its dependencies, optionally runs the RapiDAST scan
    (`run_dast`), and runs the chainsaw tests of the product branch. The cluster is removed with the owning
    PipelineRun.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'opentelemetry-operator-e2e-tests'
    - name: namespace
      description: 'Namespace of the OpenTelemetry operator (the e2e tests expect opentelemetry-operator-system)'
      default: 'opentelemetry-operator-system'
    - name: ocp_version
      description: OpenShift minor version of the cluster. The pipeline runs only for the FBC of this OCP version.
      default: "4.22"
    - name: run_dast
      description: 'Run the RapiDAST scan ("true" or "false")'
      default: "false"
    - name: otel_tests_branch
      description: "Optional. The branch of openshift/open-telemetry-opentelemetry-operator from which to run the tests. By default it is rhosdt-<ART version>, the branch of the release of the FBC."
      default: ""
    - name: skip_tests
      description: "Tests to be skipped seperated with a space delimiter"
      default: "tests/e2e/smoke-ip-families tests/e2e-otel/google* tests/e2e-otel/oidcauthextension tests/e2e-otel/*aws* tests/e2e-otel/azuremonitorlogs tests/e2e/smoke-ports tests/e2e-targetallocator/targetallocator-prometheuscr tests/e2e-instrumentation/instrumentation-go tests/e2e-multi-instrumentation/instrumentation-multi-multicontainer-go tests/e2e/httpRoute"
    - name: rhosdt_version
      description: "Optional. Version that tags the RapiDAST scan results in GCS (folder rhosdt/<version>). By default it is the ART version, for example 0.158."
      default: ""
    - name: stage_registry_secret
      description: Secret of this namespace (type dockerconfigjson) with the credentials of registry.stage.redhat.io
      default: "stage-registry-creds"
    - name: rapidast_secret
      description: Secret of this namespace with the GCS service account key (key sa-key) for the RapiDAST results
      default: "rapidast-sa-rhosdt-key"
    - name: compute_node_type
      description: AWS instance type for ephemeral HyperShift worker nodes
      default: "m5.2xlarge"
    - name: hypershift_node_count
      description: Number of worker nodes for the ephemeral HyperShift cluster
      default: "3"
    - name: hosted_management_cluster
      description: Hosted management cluster used to provision the ephemeral cluster
      default: "hosted-mgmt2"
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: resolve-ocp-version
      description: Finds the OCP version of the FBC fragment and compares it with ocp_version
      runAfter:
        - parse-metadata
      params:
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: OCP_VERSION
          value: $(params.ocp_version)
      taskSpec:
        params:
          - name: FBC_FRAGMENT
            type: string
          - name: OCP_VERSION
            type: string
        results:
          - name: ocp-version
            description: OCP version of the FBC fragment
          - name: matches
            description: '"true" when the FBC fragment is for the OCP version of this scenario'
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            env:
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: OCP_VERSION
                value: $(params.OCP_VERSION)
            script: |
              #!/bin/bash
              set -euo pipefail

              # Only the config blob of the image is read (an FBC image is large). The label
              # com.redhat.fbc.openshift.version (a JSON array, for example ["v4.14"]) wins when it is set,
              # otherwise the version label of the operator-registry base image is used (for example v4.21.0).
              raw=$(skopeo inspect --retry-times 3 --config --override-os linux --override-arch amd64 "docker://${FBC_FRAGMENT}" \
                | jq -r '.config.Labels["com.redhat.fbc.openshift.version"] // .config.Labels.version // empty')
              if [ -z "${raw}" ]; then
                echo "ERROR: no OCP version label on ${FBC_FRAGMENT}"
                exit 1
              fi
              versions=$(echo "${raw}" | tr -d '[]" ' | tr ',' '\n' | sed -E 's/^v//' | cut -d. -f1,2)
              echo "FBC fragment ${FBC_FRAGMENT} is for OCP: $(echo "${versions}" | tr "\n" " ")"
              echo "This scenario runs on OCP ${OCP_VERSION}"

              want="${OCP_VERSION#v}"
              if ! [[ "${want}" =~ ^[0-9]+\.[0-9]+$ ]]; then
                echo "ERROR: ocp_version must look like 4.22, got '${OCP_VERSION}'"
                exit 1
              fi

              echo -n "$(echo "${versions}" | head -n1)" > "$(results.ocp-version.path)"
              if echo "${versions}" | grep -qxF "${want}"; then
                echo -n "true" > "$(results.matches.path)"
              else
                echo "Skipping: not the OCP version of this scenario."
                echo -n "false" > "$(results.matches.path)"
              fi
    - name: resolve-release
      description: Reads the versions of the release under test from the FBC and from the branch of the release, so that the pipeline needs no per-release parameters
      runAfter:
        - resolve-ocp-version
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: APPLICATION_NAME
          value: $(tasks.parse-metadata.results.application-name)
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: TESTS_BRANCH_OVERRIDE
          value: $(params.otel_tests_branch)
        - name: RHOSDT_VERSION_OVERRIDE
          value: $(params.rhosdt_version)
      taskSpec:
        params:
          - name: APPLICATION_NAME
            type: string
          - name: FBC_FRAGMENT
            type: string
          - name: TESTS_BRANCH_OVERRIDE
            type: string
          - name: RHOSDT_VERSION_OVERRIDE
            type: string
        results:
          - name: art-version
            description: ART version of the release, for example 0.158
          - name: tests-branch
            description: Branch of openshift/open-telemetry-opentelemetry-operator that is tested, for example rhosdt-0.158
          - name: operator-version
            description: Version of the operator, from versions.txt of the branch
          - name: operator-collector-version
            description: Version of the collector that the operator expects, from versions.txt of the branch
          - name: operator-targetallocator-version
            description: Version of the target allocator, from versions.txt of the branch
          - name: collector-version
            description: Version of the Red Hat build of the collector, from manifest.yaml of openshift/redhat-opentelemetry-collector
          - name: csv-name
            description: Name of the newest CSV in the stable channel of the FBC, for example opentelemetry-operator.v0.158.0-3
          - name: rhosdt-version
            description: Version that tags the DAST results, the ART version unless it is overridden
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            env:
              - name: APPLICATION_NAME
                value: $(params.APPLICATION_NAME)
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: TESTS_BRANCH_OVERRIDE
                value: $(params.TESTS_BRANCH_OVERRIDE)
              - name: RHOSDT_VERSION_OVERRIDE
                value: $(params.RHOSDT_VERSION_OVERRIDE)
            script: |
              #!/bin/bash
              set -euo pipefail

              fail() {
                echo "ERROR: $*" >&2
                exit 1
              }

              # Read a file of a branch of an openshift repository.
              raw() {
                curl -fsSL --retry 5 --retry-delay 10 "https://raw.githubusercontent.com/openshift/$1/$2/$3" \
                  || fail "cannot read $3 on the branch $2 of openshift/$1"
              }

              # The ART version comes from the application of the Snapshot: fbc-rhosdt-0-158 is 0.158.
              if [[ ! "${APPLICATION_NAME}" =~ ^fbc-rhosdt-([0-9]+)-([0-9]+)$ ]]; then
                fail "the application '${APPLICATION_NAME}' does not look like fbc-rhosdt-<major>-<minor>"
              fi
              ART_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              RELEASE_BRANCH="rhosdt-${ART_VERSION}"
              # The branch under test is the branch of the release, unless the scenario sets another one.
              TESTS_BRANCH="${TESTS_BRANCH_OVERRIDE:-${RELEASE_BRANCH}}"

              # The versions of the operator, the collector and the target allocator.
              VERSIONS_TXT=$(raw open-telemetry-opentelemetry-operator "${TESTS_BRANCH}" versions.txt)
              version_of() {
                local v
                v=$(awk -F= -v k="$1" '$1 == k {print $2}' <<<"${VERSIONS_TXT}")
                [[ -n "${v}" ]] || fail "versions.txt on the branch ${TESTS_BRANCH} has no key '$1'"
                echo -n "${v}"
              }
              OPERATOR_VERSION=$(version_of operator)
              OPERATOR_COLLECTOR_VERSION=$(version_of opentelemetry-collector)
              OPERATOR_TARGETALLOCATOR_VERSION=$(version_of targetallocator)

              COLLECTOR_VERSION=$(raw redhat-opentelemetry-collector "${RELEASE_BRANCH}" manifest.yaml | yq '.dist.version')
              [[ -n "${COLLECTOR_VERSION}" && "${COLLECTOR_VERSION}" != "null" ]] \
                || fail "manifest.yaml on the branch ${RELEASE_BRANCH} of openshift/redhat-opentelemetry-collector has no dist.version"

              # The CSV that the FBC installs is the newest entry of the stable channel. ART adds an entry for every build.
              WORK=$(mktemp -d)
              oc image extract "${FBC_FRAGMENT}" --filter-by-os=linux/amd64 --path /configs/:"${WORK}" --confirm >/dev/null \
                || fail "cannot read the catalog of ${FBC_FRAGMENT}"
              [[ -d "${WORK}/opentelemetry-product" ]] || fail "the FBC has no opentelemetry-product catalog"
              CSV_NAME=$(opm render "${WORK}/opentelemetry-product" -o json \
                | jq -r 'select(.schema == "olm.channel" and .name == "stable") | .entries[].name' | sort -V | tail -n1)
              [[ "${CSV_NAME}" == opentelemetry-operator.v* ]] || fail "no CSV in the stable channel of the FBC (found '${CSV_NAME}')"

              # The expected versions are read from the branch as it is now. An FBC of an older build installs another operator
              # version, and its images would fail the version checks for no reason, so stop with a message.
              CSV_VERSION="${CSV_NAME#opentelemetry-operator.v}"
              CSV_VERSION="${CSV_VERSION%-*}"
              [[ "${CSV_VERSION}" == "${OPERATOR_VERSION}" ]] \
                || fail "the FBC installs the operator ${CSV_VERSION} (${CSV_NAME}), but versions.txt on the branch ${TESTS_BRANCH} says ${OPERATOR_VERSION}: the FBC is older than the branch, the next build is tested"

              RHOSDT_VERSION="${RHOSDT_VERSION_OVERRIDE:-${ART_VERSION}}"

              echo "ART version:                ${ART_VERSION}"
              echo "Tests branch:               ${TESTS_BRANCH}"
              echo "Operator:                   ${OPERATOR_VERSION}"
              echo "Collector (operator):       ${OPERATOR_COLLECTOR_VERSION}"
              echo "Target allocator:           ${OPERATOR_TARGETALLOCATOR_VERSION}"
              echo "Collector (Red Hat build):  ${COLLECTOR_VERSION}"
              echo "CSV (stable channel head):  ${CSV_NAME}"
              echo "DAST results folder:        rhosdt/${RHOSDT_VERSION}"

              echo -n "${ART_VERSION}" > "$(results.art-version.path)"
              echo -n "${TESTS_BRANCH}" > "$(results.tests-branch.path)"
              echo -n "${OPERATOR_VERSION}" > "$(results.operator-version.path)"
              echo -n "${OPERATOR_COLLECTOR_VERSION}" > "$(results.operator-collector-version.path)"
              echo -n "${OPERATOR_TARGETALLOCATOR_VERSION}" > "$(results.operator-targetallocator-version.path)"
              echo -n "${COLLECTOR_VERSION}" > "$(results.collector-version.path)"
              echo -n "${CSV_NAME}" > "$(results.csv-name.path)"
              echo -n "${RHOSDT_VERSION}" > "$(results.rhosdt-version.path)"
    - name: prepare-cluster-env
      runAfter:
        - resolve-release
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: compute_node_type
          value: $(params.compute_node_type)
        - name: hypershift_node_count
          value: $(params.hypershift_node_count)
        - name: hosted_management_cluster
          value: $(params.hosted_management_cluster)
      taskSpec:
        params:
          - name: compute_node_type
            type: string
          - name: hypershift_node_count
            type: string
          - name: hosted_management_cluster
            type: string
        results:
          - name: env
            description: OpenShift CI workflow environment as JSON
        steps:
          - name: prepare-env
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            script: |
              #!/bin/bash
              set -euo pipefail

              # The ART images are named registry.redhat.io/rhosdt/*@sha256:... and exist only on the stage
              # registry until the release is published.
              image_content_sources=$(cat <<'EOF'
              - source: registry.redhat.io/rhosdt
                mirrors:
                  - registry.stage.redhat.io/rhosdt
              EOF
              )

              jq -cn \
                --arg computeNodeType "$(params.compute_node_type)" \
                --arg nodeCount "$(params.hypershift_node_count)" \
                --arg managementCluster "$(params.hosted_management_cluster)" \
                --arg imageContentSources "$image_content_sources" \
                '{
                  COMPUTE_NODE_TYPE: $computeNodeType,
                  HYPERSHIFT_NODE_COUNT: $nodeCount,
                  HOSTED_MANAGEMENT_CLUSTER: $managementCluster,
                  IMAGE_CONTENT_SOURCES: $imageContentSources
                }' | tee "$(results.env.path)"
    - name: provision-cluster
      runAfter:
        - prepare-cluster-env
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 75m
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp_version)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.env)
    - name: add-stage-credentials
      description: Adds the stage registry credentials to the pull secret of the cluster
      timeout: "30m"
      runAfter:
        - provision-cluster
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
        - name: stageRegistrySecret
          value: $(params.stage_registry_secret)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
          - name: stageRegistrySecret
            type: string
        volumes:
          # Both secrets are optional so that a missing Secret fails the step with a message below. A missing
          # required Secret keeps the pod in PodInitializing until the task timeout, without a message.
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
              optional: true
          - name: stage-registry
            secret:
              secretName: $(params.stageRegistrySecret)
              optional: true
        steps:
          - name: add-pull-secret
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: stage-registry
                mountPath: /stage
                readOnly: true
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              if [ ! -s /credentials/kubeconfig ]; then
                echo "ERROR: the Secret $(params.clusterCredentialsSecretRef) with the cluster kubeconfig does not exist or has no kubeconfig key"
                exit 1
              fi
              if [ ! -s /stage/.dockerconfigjson ]; then
                echo "ERROR: the Secret $(params.stageRegistrySecret) does not exist in this namespace or has no .dockerconfigjson key"
                exit 1
              fi

              echo "Adding the stage registry credentials to the pull secret of the cluster"

              # Hosted clusters: HyperShift merges this secret into the global pull secret of the nodes
              # (OCP versions with the global pull secret feature).
              oc create secret generic additional-pull-secret -n kube-system \
                --type=kubernetes.io/dockerconfigjson \
                --from-file=.dockerconfigjson=/stage/.dockerconfigjson \
                --dry-run=client -o yaml | oc apply -f -

              # Other clusters: merge the credentials into the pull secret in openshift-config.
              oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > /tmp/current.json
              jq -s '.[0] * {auths: (.[0].auths + .[1].auths)}' /tmp/current.json /stage/.dockerconfigjson > /tmp/merged.json
              oc set data secret/pull-secret -n openshift-config --from-file=.dockerconfigjson=/tmp/merged.json

              # Wait until the nodes got it, when a syncer runs on the cluster.
              if oc get daemonset global-pull-secret-syncer -n kube-system >/dev/null 2>&1; then
                oc rollout status daemonset/global-pull-secret-syncer -n kube-system --timeout=10m
              else
                echo "No global-pull-secret-syncer daemonset on this cluster, waiting 2 minutes for the nodes"
                sleep 120
              fi
    - name: install-operator-from-fbc
      description: Installs the OpenTelemetry operator from the FBC fragment with a CatalogSource and a Subscription
      runAfter:
        - add-stage-credentials
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: namespace
          value: $(params.namespace)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: FBC_FRAGMENT
            type: string
          - name: namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: install-operator
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: OTEL_NAMESPACE
                value: $(params.namespace)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              echo "Installing the OpenTelemetry operator from ${FBC_FRAGMENT}"

              oc create namespace "${OTEL_NAMESPACE}" --dry-run=client -o yaml | oc apply -f -
              oc label namespace "${OTEL_NAMESPACE}" openshift.io/cluster-monitoring=true --overwrite

              cat <<EOF | oc apply -f -
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: art-catalog-otel
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: ${FBC_FRAGMENT}
                displayName: ART Catalog OTEL
                publisher: ART
              ---
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: ${OTEL_NAMESPACE}
                namespace: ${OTEL_NAMESPACE}
              spec:
                upgradeStrategy: Default
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: opentelemetry-product
                namespace: ${OTEL_NAMESPACE}
              spec:
                channel: stable
                installPlanApproval: Automatic
                name: opentelemetry-product
                source: art-catalog-otel
                sourceNamespace: openshift-marketplace
              EOF

              echo "Waiting for the catalog source"
              for i in $(seq 1 40); do
                state=$(oc get catalogsource art-catalog-otel -n openshift-marketplace -o jsonpath='{.status.connectionState.lastObservedState}')
                [ "${state}" = "READY" ] && break
                echo "Try ${i}/40: catalog source state is '${state}'"
                sleep 15
              done
              [ "${state}" = "READY" ] || { echo "The catalog source did not become READY"; oc get pods -n openshift-marketplace; exit 1; }

              echo "Waiting for the operator"
              csv=""
              for i in $(seq 1 60); do
                csv=$(oc get subscription opentelemetry-product -n "${OTEL_NAMESPACE}" -o jsonpath='{.status.installedCSV}')
                if [ -n "${csv}" ] && [ "$(oc get csv "${csv}" -n "${OTEL_NAMESPACE}" -o jsonpath='{.status.phase}')" = "Succeeded" ]; then
                  echo "${csv} is installed"
                  break
                fi
                echo "Try ${i}/60: the operator is not installed yet (csv: '${csv}')"
                sleep 20
              done
              if [ -z "${csv}" ] || [ "$(oc get csv "${csv}" -n "${OTEL_NAMESPACE}" -o jsonpath='{.status.phase}')" != "Succeeded" ]; then
                echo "The operator was not installed (csv: '${csv}')"
                oc get subscription,installplan,csv -n "${OTEL_NAMESPACE}" || true
                exit 1
              fi
              oc wait --for condition=Available -n "${OTEL_NAMESPACE}" deployment opentelemetry-operator-controller-manager --timeout=5m
    - name: check-opentelemetry-version
      description: The task checks OpenTelemetry operator and operand version details and image info
      runAfter:
        - install-operator-from-fbc
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: namespace
          value: $(params.namespace)
        - name: OPERATOR_VERSION
          value: $(tasks.resolve-release.results.operator-version)
        - name: OPERATOR_OTEL_COLLECTOR_VERSION
          value: $(tasks.resolve-release.results.operator-collector-version)
        - name: OPERATOR_TARGETALLOCATOR_VERSION
          value: $(tasks.resolve-release.results.operator-targetallocator-version)
        - name: OTEL_COLLECTOR_VERSION
          value: $(tasks.resolve-release.results.collector-version)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
        - name: stageRegistrySecret
          value: $(params.stage_registry_secret)
      taskSpec:
        params:
          - name: namespace
            type: string
          - name: OPERATOR_VERSION
            type: string
          - name: OPERATOR_OTEL_COLLECTOR_VERSION
            type: string
          - name: OPERATOR_TARGETALLOCATOR_VERSION
            type: string
          - name: OTEL_COLLECTOR_VERSION
            type: string
          - name: clusterCredentialsSecretRef
            type: string
          - name: stageRegistrySecret
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: stage-registry
            secret:
              secretName: $(params.stageRegistrySecret)
        steps:
          - name: check-version
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OTEL_NAMESPACE
                value: $(params.namespace)
              - name: OPERATOR_VERSION
                value: $(params.OPERATOR_VERSION)
              - name: OPERATOR_OTEL_COLLECTOR_VERSION
                value: $(params.OPERATOR_OTEL_COLLECTOR_VERSION)
              - name: OPERATOR_TARGETALLOCATOR_VERSION
                value: $(params.OPERATOR_TARGETALLOCATOR_VERSION)
              - name: OTEL_COLLECTOR_VERSION
                value: $(params.OTEL_COLLECTOR_VERSION)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: stage-registry
                mountPath: /stage
                readOnly: true
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -eu

              function log_cmd() {
                  echo "\$ $*"
                  "$@"
              }
              function exit_error() {
                  >&2 echo -e "ERROR: $*"
                  exit 1
              }

              function generate_random_name() {
                  echo "random-name-$RANDOM"
              }

              function wait_for_pod_running() {
                  local pod_name=$1
                  local namespace=$2
                  for _ in $(seq 1 150); do
                      pod_status=$(oc get pod $pod_name -n $namespace -o jsonpath='{.status.phase}')
                      if [ "$pod_status" == "Running" ] || [ "$pod_status" == "Succeeded" ]; then
                          return 0
                      elif [ "$pod_status" == "Failed" ] || [ "$pod_status" == "Unknown" ]; then
                          exit_error "Pod $pod_name failed to start. Status: $pod_status"
                      fi
                      sleep 2
                  done
                  oc describe pod $pod_name -n $namespace
                  exit_error "Pod $pod_name did not start. Status: $pod_status"
              }

              function check_strings_in_logs() {
                  local pod_name=$1
                  local namespace=$2
                  shift 2
                  local strings=("$@")

                  logs=$(oc logs pod/$pod_name -n $namespace)
                  for string in "${strings[@]}"; do
                      if ! echo "$logs" | grep -q "$string"; then
                          exit_error "String '$string' not found in logs of pod $pod_name"
                      fi
                  done
              }

              echo
              echo "OPENTELEMETRY IMAGE DETAILS AND VERSION INFO"
              echo

              otel_images=$(oc get deployment opentelemetry-operator-controller-manager -n "${OTEL_NAMESPACE}" -o yaml | grep -oE 'registry\.redhat\.io/rhosdt/[^"[:space:]]+' | sort -u || true)
              [ -n "$otel_images" ] || exit_error "No registry.redhat.io/rhosdt images in the operator deployment"
              [ "$(echo "$otel_images" | wc -l)" -eq 3 ] || exit_error "Expected 3 images, found:\n$otel_images"

              for image in $otel_images; do
                  # The images are on the stage registry until the release is published.
                  oc image info "${image/registry.redhat.io/registry.stage.redhat.io}" --registry-config /stage/.dockerconfigjson --filter-by-os linux/amd64
                  echo

                  random_name=$(generate_random_name)

                  if [[ $image == *opentelemetry-rhel9-operator* ]]; then
                      log_cmd oc run $random_name -n default --image=$image
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default | head -n 2
                      check_strings_in_logs $random_name default "\"opentelemetry-operator\":\"${OPERATOR_VERSION}\"" "opentelemetry-collector:${OPERATOR_OTEL_COLLECTOR_VERSION}" "target-allocator:${OPERATOR_TARGETALLOCATOR_VERSION}"
                  elif [[ $image == *opentelemetry-target-allocator-rhel9* ]]; then
                      echo "SKIPPED: $image doesn't have a version command"
                  else
                      log_cmd oc run $random_name -n default --image=$image -- --version
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default
                      check_strings_in_logs $random_name default "otelcol version ${OTEL_COLLECTOR_VERSION}"
                  fi

                  echo
                  echo
              done
    - name: operators-install
      description: Task to install the dependent operators from the Red Hat Operators catalog
      runAfter:
        - install-operator-from-fbc
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: install-operators
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              # Loki and cluster-logging pin a channel that follows the OCP version: take the default channel of
              # the catalog of the cluster.
              pm_channel() {
                oc get packagemanifest -n openshift-marketplace -o json | \
                  jq -r --arg n "$1" '[.items[] | select(.metadata.name==$n and .status.catalogSource=="redhat-operators")][0].status.defaultChannel'
              }
              LOKI_CHANNEL=$(pm_channel loki-operator)
              LOGGING_CHANNEL=$(pm_channel cluster-logging)
              for c in "${LOKI_CHANNEL}" "${LOGGING_CHANNEL}"; do
                if [ -z "$c" ] || [ "$c" = "null" ]; then
                  echo "ERROR: could not resolve the channel of loki-operator ('${LOKI_CHANNEL}') or cluster-logging ('${LOGGING_CHANNEL}')"
                  exit 1
                fi
              done

              echo "Installing the dependent operators"
              cat <<EOF | oc apply -f -
              apiVersion: project.openshift.io/v1
              kind: Project
              metadata:
                name: openshift-tempo-operator
              ---
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: openshift-tempo-operator
                namespace: openshift-tempo-operator
              spec:
                upgradeStrategy: Default
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: tempo-product
                namespace: openshift-tempo-operator
              spec:
                channel: stable
                installPlanApproval: Automatic
                name: tempo-product
                source: redhat-operators
                sourceNamespace: openshift-marketplace
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: amq-streams
                namespace: openshift-operators
              spec:
                channel: stable
                installPlanApproval: Automatic
                name: amq-streams
                source: redhat-operators
                sourceNamespace: openshift-marketplace
              ---
              apiVersion: project.openshift.io/v1
              kind: Project
              metadata:
                name: openshift-cluster-observability-operator
              ---
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: openshift-cluster-observability-operator
                namespace: openshift-cluster-observability-operator
              spec:
                upgradeStrategy: Default
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: cluster-observability-operator
                namespace: openshift-cluster-observability-operator
              spec:
                channel: stable
                installPlanApproval: Automatic
                name: cluster-observability-operator
                source: redhat-operators
                sourceNamespace: openshift-marketplace
              ---
              apiVersion: project.openshift.io/v1
              kind: Project
              metadata:
                name: openshift-operators-redhat
              ---
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: openshift-operators-redhat
                namespace: openshift-operators-redhat
              spec:
                upgradeStrategy: Default
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: loki-operator
                namespace: openshift-operators-redhat
              spec:
                channel: ${LOKI_CHANNEL}
                installPlanApproval: Automatic
                name: loki-operator
                source: redhat-operators
                sourceNamespace: openshift-marketplace
              ---
              apiVersion: project.openshift.io/v1
              kind: Project
              metadata:
                name: openshift-logging
              ---
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: openshift-logging
                namespace: openshift-logging
              spec:
                upgradeStrategy: Default
              ---
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: cluster-logging
                namespace: openshift-logging
              spec:
                channel: ${LOGGING_CHANNEL}
                installPlanApproval: Automatic
                name: cluster-logging
                source: redhat-operators
                sourceNamespace: openshift-marketplace
              EOF

              retry_count=30
              sleep_duration=30

              check_operator_installed() {
                local operator=$1
                local namespace=$2
                local csv=""

                for i in $(seq $retry_count); do
                  if [[ -z "$csv" ]]; then
                    csv=$(oc get subscription -n $namespace $operator -o jsonpath='{.status.installedCSV}')
                  fi

                  if [[ -z "$csv" ]]; then
                    echo "Try ${i}/${retry_count}: can't get the $operator yet. Checking again in $sleep_duration seconds"
                    sleep $sleep_duration
                  else
                    if [[ $(oc get csv -n $namespace $csv -o jsonpath='{.status.phase}') == "Succeeded" ]]; then
                      echo "$operator is successfully installed in namespace $namespace"
                      return 0
                    else
                      echo "Try ${i}/${retry_count}: $operator is not deployed yet. Checking again in $sleep_duration seconds"
                      sleep $sleep_duration
                    fi
                  fi
                done

                echo "$operator installation failed after $retry_count retries in namespace $namespace."
                return 1
              }

              echo "Checking installation status of operators..."
              check_operator_installed "tempo-product" openshift-tempo-operator
              check_operator_installed "amq-streams" openshift-operators
              check_operator_installed "cluster-observability-operator" openshift-cluster-observability-operator
              check_operator_installed "loki-operator" openshift-operators-redhat
              check_operator_installed "cluster-logging" openshift-logging
              echo "Operator installation check completed."
    - name: opentelemetry-e2e-tests
      description: Task to run the tests of the product branch
      runAfter:
        - check-opentelemetry-version
        - dast-test
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: OTEL_TESTS_BRANCH
          value: $(tasks.resolve-release.results.tests-branch)
        - name: SKIP_TESTS
          value: $(params.skip_tests)
        - name: OTEL_NAMESPACE
          value: $(params.namespace)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: OTEL_TESTS_BRANCH
            type: string
          - name: SKIP_TESTS
            type: string
          - name: OTEL_NAMESPACE
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: run-e2e-tests
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OTEL_TESTS_BRANCH
                value: $(params.OTEL_TESTS_BRANCH)
              - name: SKIP_TESTS
                value: $(params.SKIP_TESTS)
              - name: OTEL_NAMESPACE
                value: $(params.OTEL_NAMESPACE)
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -uo pipefail

              echo "Run e2e tests"
              git clone https://github.com/openshift/open-telemetry-opentelemetry-operator.git /tmp/otel-tests
              cd /tmp/otel-tests
              git checkout "${OTEL_TESTS_BRANCH}"

              #Enable user workload monitoring
              oc apply -f tests/e2e-openshift/otlp-metrics-traces/01-workload-monitoring.yaml
              unset NAMESPACE

              # Install the Prometheus ScrapeConfig CRD from a pinned release, unless the cluster already has it
              if oc get crd scrapeconfigs.monitoring.coreos.com >/dev/null 2>&1; then
                echo "The ScrapeConfig CRD exists, not changing it"
              else
                oc create -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.1/example/prometheus-operator-crd/monitoring.coreos.com_scrapeconfigs.yaml || { echo "Could not install the ScrapeConfig CRD"; exit 1; }
              fi

              # The OpenShift version of the cluster selects the sidecar tests and the tests to skip
              oc_version=$(oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || true)
              oc_version_major=${oc_version%%.*}
              oc_version_minor=${oc_version#*.}
              oc_version_minor=${oc_version_minor%%.*}
              [[ "$oc_version_major" =~ ^[0-9]+$ && "$oc_version_minor" =~ ^[0-9]+$ ]] || { oc_version_major=""; oc_version_minor=""; }

              # The Loki Operator of OpenShift 4.16 and older has no OTLP ingestion, which this test exports to.
              # The old Konflux pipeline for 4.14 and the OCP CI stage jobs of 4.16 and older skip it as well.
              if [[ "$oc_version_major" == "4" ]] && [[ "$oc_version_minor" -le 16 ]]; then
                echo "OpenShift ${oc_version_major}.${oc_version_minor}: skipping the LokiStack test, the Loki Operator has no OTLP ingestion"
                SKIP_TESTS+=" tests/e2e-openshift/export-to-cluster-logging-lokistack"
              fi

              # Remove test cases to be skipped from the test run
              IFS=' ' read -ra SKIP_TEST_ARRAY <<< "$SKIP_TESTS"
              SKIP_TESTS_TO_REMOVE=""
              INVALID_TESTS=""
              for test in "${SKIP_TEST_ARRAY[@]}"; do
                if [[ "$test" == tests/* ]]; then
                  SKIP_TESTS_TO_REMOVE+=" $test"
                else
                  INVALID_TESTS+=" $test"
                fi
              done

              if [[ -n "$INVALID_TESTS" ]]; then
                echo "These test cases are not valid to be skipped: $INVALID_TESTS"
              fi

              if [[ -n "$SKIP_TESTS_TO_REMOVE" ]]; then
                rm -rf $SKIP_TESTS_TO_REMOVE
              fi

              # The .chainsaw.yaml of the product branch writes the JUnit report here and chainsaw fails when
              # the directory does not exist.
              mkdir -p .testresults/e2e

              # Initialize a variable to keep track of errors
              any_errors=false

              # Set the sidecar selector from the OpenShift version
              selector="sidecar=legacy"
              if [[ -n "$oc_version_major" ]] && { [[ "$oc_version_major" -gt 4 ]] || [[ "$oc_version_minor" -ge 16 ]]; }; then
                selector="sidecar=native"
              fi

              # Execute OpenTelemetry e2e tests
              chainsaw test \
              --quiet \
              --test-dir \
              tests/e2e \
              tests/e2e-autoscale \
              tests/e2e-crd-validations \
              tests/e2e-openshift \
              tests/e2e-instrumentation \
              tests/e2e-pdb \
              tests/e2e-otel \
              tests/e2e-multi-instrumentation \
              tests/e2e-targetallocator-cr \
              tests/e2e-targetallocator || any_errors=true

              # Execute sidecar-related tests with version-dependent selector
              chainsaw test \
              --quiet \
              --selector "$selector" \
              --test-dir \
              tests/e2e-prometheuscr \
              tests/e2e-sidecar || any_errors=true

              # Set the operator environment variables for metadata filters tests.
              OTEL_CSV_NAME=$(oc get subscription opentelemetry-product -n "${OTEL_NAMESPACE}" -o jsonpath='{.status.installedCSV}')
              if [ -z "${OTEL_CSV_NAME}" ]; then
                echo "Could not read the installed CSV from the subscription, exiting with error."
                exit 1
              fi
              oc -n "${OTEL_NAMESPACE}" patch csv "${OTEL_CSV_NAME}" --type=json -p '[
                {"op":"add","path":"/spec/install/spec/deployments/0/spec/template/spec/containers/0/env/-","value":{"name":"ANNOTATIONS_FILTER","value":".*filter.out,config.*.gke.io.*"}},
                {"op":"add","path":"/spec/install/spec/deployments/0/spec/template/spec/containers/0/env/-","value":{"name":"LABELS_FILTER","value":".*filter.out"}}
              ]'
              sleep 60
              if oc -n "${OTEL_NAMESPACE}" get deployment opentelemetry-operator-controller-manager -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' | grep -q "True"; then
                  echo "Operator deployment updated successfully for metadata filters, continuing script execution..."
              else
                  echo "Operator deployment update for metadata filters failed, exiting with error."
                  exit 1
              fi

              # Execute OpenTelemetry e2e tests
              chainsaw test \
              --quiet \
              --test-dir \
              tests/e2e-metadata-filters || any_errors=true

              # Check if any errors occurred
              if $any_errors; then
                echo "Tests failed, check the logs for more details."
                exit 1
              else
                echo "All the tests passed."
              fi
    - name: dast-test
      description: Task to run Dynamic Application Security Testing (DAST) using RapiDAST. It runs before the tests of the product branch, on the cluster with the operators installed.
      runAfter:
        - check-opentelemetry-version
        - operators-install
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
        - input: $(params.run_dast)
          operator: in
          values: ["true"]
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
        - name: rapidastSecret
          value: $(params.rapidast_secret)
        - name: rhosdtVersion
          value: $(tasks.resolve-release.results.rhosdt-version)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
          - name: rapidastSecret
            type: string
          - name: rhosdtVersion
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          # The Secret is optional so that a missing Secret fails the step with a message below. A missing
          # required Secret keeps the pod in PodInitializing until the task timeout, without a message.
          - name: gcs-key
            secret:
              secretName: $(params.rapidastSecret)
              optional: true
        steps:
          - name: rapidast-scan
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: gcs-key
                mountPath: /etc/gcs
                readOnly: true
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: RHOSDT_VERSION
                value: $(params.rhosdtVersion)
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              if [ ! -s /etc/gcs/sa-key ]; then
                echo "ERROR: the Secret $(params.rapidastSecret) does not exist in this namespace or has no key sa-key"
                exit 1
              fi

              echo "Clone distributed-tracing-qe repository"
              git clone https://github.com/openshift/distributed-tracing-qe.git /tmp/distributed-tracing-tests
              cd /tmp/distributed-tracing-tests

              # Generate GCS secret manifest for chainsaw to apply on the ephemeral cluster
              kubectl create secret generic rapidast-sa-rhosdt-key \
                --from-file=sa-key=/etc/gcs/sa-key \
                --namespace=rapidast-otel \
                --dry-run=client -o yaml > tests/e2e-rh-sdl/rapidast-otel/gcs-secret.yaml

              # Unset environment variable which conflicts with Chainsaw
              unset NAMESPACE

              # Execute DAST test using RapiDAST
              chainsaw test \
              --config .chainsaw-rh-sdl.yaml \
              --test-dir \
              tests/e2e-rh-sdl/rapidast-otel
