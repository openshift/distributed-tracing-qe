---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: opentelemetry-operator-upgrade-test-fbc
spec:
  description: |
    Upgrade test of the Red Hat build of OpenTelemetry for an ART FBC build. The pipeline runs when ART has built
    the FBC fragment, and does nothing when the fragment is for another OCP version than `ocp_version`.

    The pipeline creates an ephemeral OpenShift CI HyperShift cluster of `ocp_version`, adds the stage registry
    credentials and a mirror from registry.redhat.io/rhosdt to registry.stage.redhat.io/rhosdt, and runs the
    upgrade test (tests/e2e-openshift-upgrade) of the product branch: it installs the released operator from
    redhat-operators, creates a catalog source from the FBC fragment and upgrades the operator to the version in it.
    The cluster is removed with the owning PipelineRun.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'opentelemetry-operator-upgrade-test-fbc'
      type: string
    - name: namespace
      description: 'Namespace to run tests in'
      default: 'opentelemetry-operator-system'
      type: string
    - name: ocp_version
      description: OpenShift minor version of the cluster. The pipeline runs only for the FBC of this OCP version.
      default: "4.22"
    - name: otel_tests_branch
      description: "Optional. The branch of openshift/open-telemetry-opentelemetry-operator from which to run the tests. By default it is rhosdt-<ART version>, the branch of the release of the FBC."
      type: string
      default: ""
    - name: stage_registry_secret
      description: Secret of this namespace (type dockerconfigjson) with the credentials of registry.stage.redhat.io
      default: "stage-registry-creds"
    - name: compute_node_type
      description: AWS instance type for ephemeral HyperShift worker nodes
      default: "m5.2xlarge"
    - name: hypershift_node_count
      description: Number of worker nodes for the ephemeral HyperShift cluster
      default: "3"
    - name: hosted_management_cluster
      description: Hosted management cluster used to provision the ephemeral cluster
      default: "hosted-mgmt2"
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: resolve-ocp-version
      description: Finds the OCP version of the FBC fragment and compares it with ocp_version
      runAfter:
        - parse-metadata
      params:
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: OCP_VERSION
          value: $(params.ocp_version)
      taskSpec:
        params:
          - name: FBC_FRAGMENT
            type: string
          - name: OCP_VERSION
            type: string
        results:
          - name: ocp-version
            description: OCP version of the FBC fragment
          - name: matches
            description: '"true" when the FBC fragment is for the OCP version of this scenario'
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            env:
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: OCP_VERSION
                value: $(params.OCP_VERSION)
            script: |
              #!/bin/bash
              set -euo pipefail

              # Only the config blob of the image is read (an FBC image is large). The label
              # com.redhat.fbc.openshift.version (a JSON array, for example ["v4.14"]) wins when it is set,
              # otherwise the version label of the operator-registry base image is used (for example v4.21.0).
              raw=$(skopeo inspect --retry-times 3 --config --override-os linux --override-arch amd64 "docker://${FBC_FRAGMENT}" \
                | jq -r '.config.Labels["com.redhat.fbc.openshift.version"] // .config.Labels.version // empty')
              if [ -z "${raw}" ]; then
                echo "ERROR: no OCP version label on ${FBC_FRAGMENT}"
                exit 1
              fi
              versions=$(echo "${raw}" | tr -d '[]" ' | tr ',' '\n' | sed -E 's/^v//' | cut -d. -f1,2)
              echo "FBC fragment ${FBC_FRAGMENT} is for OCP: $(echo "${versions}" | tr "\n" " ")"
              echo "This scenario runs on OCP ${OCP_VERSION}"

              want="${OCP_VERSION#v}"
              if ! [[ "${want}" =~ ^[0-9]+\.[0-9]+$ ]]; then
                echo "ERROR: ocp_version must look like 4.22, got '${OCP_VERSION}'"
                exit 1
              fi

              echo -n "$(echo "${versions}" | head -n1)" > "$(results.ocp-version.path)"
              if echo "${versions}" | grep -qxF "${want}"; then
                echo -n "true" > "$(results.matches.path)"
              else
                echo "Skipping: not the OCP version of this scenario."
                echo -n "false" > "$(results.matches.path)"
              fi
    - name: resolve-release
      description: Reads the versions of the release under test from the FBC and from the branch of the release, so that the pipeline needs no per-release parameters
      runAfter:
        - resolve-ocp-version
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: APPLICATION_NAME
          value: $(tasks.parse-metadata.results.application-name)
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: TESTS_BRANCH_OVERRIDE
          value: $(params.otel_tests_branch)
        - name: RHOSDT_VERSION_OVERRIDE
          value: ""
      taskSpec:
        params:
          - name: APPLICATION_NAME
            type: string
          - name: FBC_FRAGMENT
            type: string
          - name: TESTS_BRANCH_OVERRIDE
            type: string
          - name: RHOSDT_VERSION_OVERRIDE
            type: string
        results:
          - name: art-version
            description: ART version of the release, for example 0.158
          - name: tests-branch
            description: Branch of openshift/open-telemetry-opentelemetry-operator that is tested, for example rhosdt-0.158
          - name: operator-version
            description: Version of the operator, from versions.txt of the branch
          - name: operator-collector-version
            description: Version of the collector that the operator expects, from versions.txt of the branch
          - name: operator-targetallocator-version
            description: Version of the target allocator, from versions.txt of the branch
          - name: collector-version
            description: Version of the Red Hat build of the collector, from manifest.yaml of openshift/redhat-opentelemetry-collector
          - name: csv-name
            description: Name of the newest CSV in the stable channel of the FBC, for example opentelemetry-operator.v0.158.0-3
          - name: rhosdt-version
            description: Version that tags the DAST results, the ART version unless it is overridden
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            env:
              - name: APPLICATION_NAME
                value: $(params.APPLICATION_NAME)
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: TESTS_BRANCH_OVERRIDE
                value: $(params.TESTS_BRANCH_OVERRIDE)
              - name: RHOSDT_VERSION_OVERRIDE
                value: $(params.RHOSDT_VERSION_OVERRIDE)
            script: |
              #!/bin/bash
              set -euo pipefail

              fail() {
                echo "ERROR: $*" >&2
                exit 1
              }

              # Read a file of a branch of an openshift repository.
              raw() {
                curl -fsSL --retry 5 --retry-delay 10 "https://raw.githubusercontent.com/openshift/$1/$2/$3" \
                  || fail "cannot read $3 on the branch $2 of openshift/$1"
              }

              # The ART version comes from the application of the Snapshot: fbc-rhosdt-0-158 is 0.158.
              if [[ ! "${APPLICATION_NAME}" =~ ^fbc-rhosdt-([0-9]+)-([0-9]+)$ ]]; then
                fail "the application '${APPLICATION_NAME}' does not look like fbc-rhosdt-<major>-<minor>"
              fi
              ART_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              RELEASE_BRANCH="rhosdt-${ART_VERSION}"
              # The branch under test is the branch of the release, unless the scenario sets another one.
              TESTS_BRANCH="${TESTS_BRANCH_OVERRIDE:-${RELEASE_BRANCH}}"

              # The versions of the operator, the collector and the target allocator.
              VERSIONS_TXT=$(raw open-telemetry-opentelemetry-operator "${TESTS_BRANCH}" versions.txt)
              version_of() {
                local v
                v=$(awk -F= -v k="$1" '$1 == k {print $2}' <<<"${VERSIONS_TXT}")
                [[ -n "${v}" ]] || fail "versions.txt on the branch ${TESTS_BRANCH} has no key '$1'"
                echo -n "${v}"
              }
              OPERATOR_VERSION=$(version_of operator)
              OPERATOR_COLLECTOR_VERSION=$(version_of opentelemetry-collector)
              OPERATOR_TARGETALLOCATOR_VERSION=$(version_of targetallocator)

              COLLECTOR_VERSION=$(raw redhat-opentelemetry-collector "${RELEASE_BRANCH}" manifest.yaml | yq '.dist.version')
              [[ -n "${COLLECTOR_VERSION}" && "${COLLECTOR_VERSION}" != "null" ]] \
                || fail "manifest.yaml on the branch ${RELEASE_BRANCH} of openshift/redhat-opentelemetry-collector has no dist.version"

              # The CSV that the FBC installs is the newest entry of the stable channel. ART adds an entry for every build.
              WORK=$(mktemp -d)
              oc image extract "${FBC_FRAGMENT}" --filter-by-os=linux/amd64 --path /configs/:"${WORK}" --confirm >/dev/null \
                || fail "cannot read the catalog of ${FBC_FRAGMENT}"
              [[ -d "${WORK}/opentelemetry-product" ]] || fail "the FBC has no opentelemetry-product catalog"
              CSV_NAME=$(opm render "${WORK}/opentelemetry-product" -o json \
                | jq -r 'select(.schema == "olm.channel" and .name == "stable") | .entries[].name' | sort -V | tail -n1)
              [[ "${CSV_NAME}" == opentelemetry-operator.v* ]] || fail "no CSV in the stable channel of the FBC (found '${CSV_NAME}')"

              # The expected versions are read from the branch as it is now. An FBC of an older build installs another operator
              # version, and its images would fail the version checks for no reason, so stop with a message.
              CSV_VERSION="${CSV_NAME#opentelemetry-operator.v}"
              CSV_VERSION="${CSV_VERSION%-*}"
              [[ "${CSV_VERSION}" == "${OPERATOR_VERSION}" ]] \
                || fail "the FBC installs the operator ${CSV_VERSION} (${CSV_NAME}), but versions.txt on the branch ${TESTS_BRANCH} says ${OPERATOR_VERSION}: the FBC is older than the branch, the next build is tested"

              RHOSDT_VERSION="${RHOSDT_VERSION_OVERRIDE:-${ART_VERSION}}"

              echo "ART version:                ${ART_VERSION}"
              echo "Tests branch:               ${TESTS_BRANCH}"
              echo "Operator:                   ${OPERATOR_VERSION}"
              echo "Collector (operator):       ${OPERATOR_COLLECTOR_VERSION}"
              echo "Target allocator:           ${OPERATOR_TARGETALLOCATOR_VERSION}"
              echo "Collector (Red Hat build):  ${COLLECTOR_VERSION}"
              echo "CSV (stable channel head):  ${CSV_NAME}"
              echo "DAST results folder:        rhosdt/${RHOSDT_VERSION}"

              echo -n "${ART_VERSION}" > "$(results.art-version.path)"
              echo -n "${TESTS_BRANCH}" > "$(results.tests-branch.path)"
              echo -n "${OPERATOR_VERSION}" > "$(results.operator-version.path)"
              echo -n "${OPERATOR_COLLECTOR_VERSION}" > "$(results.operator-collector-version.path)"
              echo -n "${OPERATOR_TARGETALLOCATOR_VERSION}" > "$(results.operator-targetallocator-version.path)"
              echo -n "${COLLECTOR_VERSION}" > "$(results.collector-version.path)"
              echo -n "${CSV_NAME}" > "$(results.csv-name.path)"
              echo -n "${RHOSDT_VERSION}" > "$(results.rhosdt-version.path)"
    - name: prepare-cluster-env
      runAfter:
        - resolve-release
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: compute_node_type
          value: $(params.compute_node_type)
        - name: hypershift_node_count
          value: $(params.hypershift_node_count)
        - name: hosted_management_cluster
          value: $(params.hosted_management_cluster)
      taskSpec:
        params:
          - name: compute_node_type
            type: string
          - name: hypershift_node_count
            type: string
          - name: hosted_management_cluster
            type: string
        results:
          - name: env
            description: OpenShift CI workflow environment as JSON
        steps:
          - name: prepare-env
            image: quay.io/konflux-ci/konflux-test:v1.4.52@sha256:aa2c97da9bb73a4e8d1c6b41950f8d902b74461be0e042debe89277fdc4ebe49
            script: |
              #!/bin/bash
              set -euo pipefail

              # The ART images are named registry.redhat.io/rhosdt/*@sha256:... and exist only on the stage
              # registry until the release is published.
              image_content_sources=$(cat <<'EOF'
              - source: registry.redhat.io/rhosdt
                mirrors:
                  - registry.stage.redhat.io/rhosdt
              EOF
              )

              jq -cn \
                --arg computeNodeType "$(params.compute_node_type)" \
                --arg nodeCount "$(params.hypershift_node_count)" \
                --arg managementCluster "$(params.hosted_management_cluster)" \
                --arg imageContentSources "$image_content_sources" \
                '{
                  COMPUTE_NODE_TYPE: $computeNodeType,
                  HYPERSHIFT_NODE_COUNT: $nodeCount,
                  HOSTED_MANAGEMENT_CLUSTER: $managementCluster,
                  IMAGE_CONTENT_SOURCES: $imageContentSources
                }' | tee "$(results.env.path)"
    - name: provision-cluster
      runAfter:
        - prepare-cluster-env
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 75m
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp_version)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.env)
    - name: add-stage-credentials
      description: Adds the stage registry credentials to the pull secret of the cluster
      timeout: "30m"
      runAfter:
        - provision-cluster
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
        - name: stageRegistrySecret
          value: $(params.stage_registry_secret)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
          - name: stageRegistrySecret
            type: string
        volumes:
          # Both secrets are optional so that a missing Secret fails the step with a message below. A missing
          # required Secret keeps the pod in PodInitializing until the task timeout, without a message.
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
              optional: true
          - name: stage-registry
            secret:
              secretName: $(params.stageRegistrySecret)
              optional: true
        steps:
          - name: add-pull-secret
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: stage-registry
                mountPath: /stage
                readOnly: true
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              if [ ! -s /credentials/kubeconfig ]; then
                echo "ERROR: the Secret $(params.clusterCredentialsSecretRef) with the cluster kubeconfig does not exist or has no kubeconfig key"
                exit 1
              fi
              if [ ! -s /stage/.dockerconfigjson ]; then
                echo "ERROR: the Secret $(params.stageRegistrySecret) does not exist in this namespace or has no .dockerconfigjson key"
                exit 1
              fi

              echo "Adding the stage registry credentials to the pull secret of the cluster"

              # Hosted clusters: HyperShift merges this secret into the global pull secret of the nodes
              # (OCP versions with the global pull secret feature).
              oc create secret generic additional-pull-secret -n kube-system \
                --type=kubernetes.io/dockerconfigjson \
                --from-file=.dockerconfigjson=/stage/.dockerconfigjson \
                --dry-run=client -o yaml | oc apply -f -

              # Other clusters: merge the credentials into the pull secret in openshift-config.
              oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > /tmp/current.json
              jq -s '.[0] * {auths: (.[0].auths + .[1].auths)}' /tmp/current.json /stage/.dockerconfigjson > /tmp/merged.json
              oc set data secret/pull-secret -n openshift-config --from-file=.dockerconfigjson=/tmp/merged.json

              # Wait until the nodes got it, when a syncer runs on the cluster.
              if oc get daemonset global-pull-secret-syncer -n kube-system >/dev/null 2>&1; then
                oc rollout status daemonset/global-pull-secret-syncer -n kube-system --timeout=10m
              else
                echo "No global-pull-secret-syncer daemonset on this cluster, waiting 2 minutes for the nodes"
                sleep 120
              fi
    - name: opentelemetry-upgrade-tests
      description: Task to run the upgrade test of the product branch
      runAfter:
        - add-stage-credentials
      when:
        - input: $(tasks.resolve-ocp-version.results.matches)
          operator: in
          values: ["true"]
      params:
        - name: OTEL_TESTS_BRANCH
          value: $(tasks.resolve-release.results.tests-branch)
        - name: COLLECTOR_VERSION
          value: $(tasks.resolve-release.results.operator-collector-version)
        - name: TA_VERSION
          value: $(tasks.resolve-release.results.operator-targetallocator-version)
        - name: OPERATOR_CSV_VERSION
          value: $(tasks.resolve-release.results.csv-name)
        - name: FBC_FRAGMENT
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: OTEL_TESTS_BRANCH
            type: string
          - name: COLLECTOR_VERSION
            type: string
          - name: TA_VERSION
            type: string
          - name: OPERATOR_CSV_VERSION
            type: string
          - name: FBC_FRAGMENT
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: run-upgrade-tests
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OTEL_TESTS_BRANCH
                value: $(params.OTEL_TESTS_BRANCH)
              - name: FBC_FRAGMENT
                value: $(params.FBC_FRAGMENT)
              - name: COLLECTOR_VERSION
                value: $(params.COLLECTOR_VERSION)
              - name: TA_VERSION
                value: $(params.TA_VERSION)
              - name: OPERATOR_CSV_VERSION
                value: $(params.OPERATOR_CSV_VERSION)
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              echo "Run upgrade tests"
              git clone https://github.com/openshift/open-telemetry-opentelemetry-operator.git /tmp/otel-tests
              cd /tmp/otel-tests
              git checkout "${OTEL_TESTS_BRANCH}"

              #Enable user workload monitoring
              oc apply -f tests/e2e-openshift/otlp-metrics-traces/01-workload-monitoring.yaml
              unset NAMESPACE

              # The .chainsaw.yaml of the product branch writes the JUnit report here and chainsaw fails when
              # the directory does not exist.
              mkdir -p .testresults/e2e

              chainsaw test --quiet tests/e2e-openshift-upgrade --values - <<EOF
              upgrade_fbc_image: ${FBC_FRAGMENT}
              upgrade_collector_version: ${COLLECTOR_VERSION}
              upgrade_ta_version: ${TA_VERSION}
              upgrade_operator_csv_name: ${OPERATOR_CSV_VERSION}
              EOF
