apiVersion: batch/v1
kind: Job
metadata:
  name: generate-logs
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: generate-logs
    spec:
      containers:
        - name: generate-logs
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.150.0
          command: ["./telemetrygen"]
          args:
            - "--otlp-endpoint=syslogexporter-collector:4318"
            - "--otlp-http"
            - "--otlp-insecure=true"
            - "--logs=3"
            - "--body=hello syslog"
            - "logs"
      restartPolicy: Never
