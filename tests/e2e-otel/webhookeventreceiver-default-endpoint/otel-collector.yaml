apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: webhookdefault
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
  config:
    receivers:
      # The receiver has no default port, so the endpoint is required: the operator's webhook_event
      # parser (open-telemetry/opentelemetry-operator#5631) rejects a receiver without endpoint and
      # exposes the port of the endpoint on the collector Service.
      webhook_event:
        endpoint: 0.0.0.0:8088

    exporters:
      debug: {}

    service:
      pipelines:
        logs:
          receivers: [webhook_event]
          exporters: [debug]
