apiVersion: apps/v1
kind: Deployment
metadata:
  name: prw-collector
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: prw-collector
spec:
  ports:
  - name: prw
    port: 9090
    protocol: TCP
    targetPort: 9090
  - name: prometheus
    port: 8889
    protocol: TCP
    targetPort: 8889
  type: ClusterIP
