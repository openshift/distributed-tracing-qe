apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
spec:
  selector:
    matchLabels:
      app: hydra
  template:
    metadata:
      labels:
        app: hydra
    spec:
      containers:
      - name: hydra
        image: docker.io/oryd/hydra:v2.2.0
        command: ["hydra", "serve", "all", "--dev", "--sqa-opt-out"]
        env:
        - name: DSN
          value: memory
        - name: SECRETS_SYSTEM
          value: saf325iouepdsg8574nb39afdu
        - name: URLS_SELF_ISSUER
          value: http://hydra:4444
        - name: STRATEGIES_ACCESS_TOKEN
          value: jwt
        ports:
        - containerPort: 4444
          name: public
        - containerPort: 4445
          name: internal
        # Hydra applies its in-memory migrations after the process starts; until then the
        # token and discovery endpoints fail and the collectors that depend on them crash.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: public
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: hydra
spec:
  selector:
    app: hydra
  ports:
  - name: public
    port: 4444
    targetPort: public
  - name: internal
    port: 4445
    targetPort: internal
