apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: memorylimiterextension
spec:
  steps:
  - name: Create OTEL collector instance with an unrealistically low memory limit
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Wait for the memory limiter to trip
    try:
    - sleep:
        duration: 5s
  - name: Attempt to send traces to the OTEL collector
    try:
    - apply:
        file: generate-telemetry-data.yaml
    - assert:
        file: generate-telemetry-data-assert.yaml
  - name: Check the export was rejected due to high memory usage
    try:
    - script:
        timeout: 5m
        content: ./check_logs.sh
