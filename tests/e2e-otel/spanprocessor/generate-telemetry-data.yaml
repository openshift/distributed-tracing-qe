apiVersion: batch/v1
kind: Job
metadata:
  name: traces-spanprocessor
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: traces-spanprocessor
    spec:
      containers:
        - name: traces-spanprocessor
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.150.0
          command: ["./telemetrygen"]
          args:
            - "--otlp-endpoint=spanprocessor-collector:4317"
            - "--otlp-insecure=true"
            - "--traces=3"
            - "--telemetry-attributes=db.svc=\"cart\""
            - "--telemetry-attributes=operation=\"checkout\""
            - "--service=spanprocessor-test"
            - "traces"
      restartPolicy: Never
