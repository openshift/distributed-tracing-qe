# Remote write v2 from the user workload monitoring Prometheus to the collector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      remoteWrite:
        - name: otel
          url: http://prw-collector.chainsaw-prw-cluster-monitoring.svc.cluster.local:9090/api/v1/write
          messageVersion: V2.0
          writeRelabelConfigs:
            - sourceLabels: [__name__]
              regex: "avalanche_.*"
              action: keep
