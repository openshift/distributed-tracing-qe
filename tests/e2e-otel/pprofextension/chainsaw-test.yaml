apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pprofextension
spec:
  steps:
  - name: Create OTEL collector instance with the pprof extension
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Query the pprof debug endpoints
    try:
    - apply:
        file: check-pprof.yaml
    - assert:
        file: check-pprof-assert.yaml
  - name: Check the pprof HTTP responses
    try:
    - script:
        timeout: 5m
        content: ./check_logs.sh
