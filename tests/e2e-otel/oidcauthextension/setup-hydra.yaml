apiVersion: batch/v1
kind: Job
metadata:
  name: setup-hydra
spec:
  template:
    spec:
      containers:
      - name: setup-hydra
        image: ghcr.io/grafana/tempo-operator/test-utils:main
        command: ["/bin/bash", "-eux", "-c"]
        args:
        - |
          # create OAuth2 client
          client_id=tenant1-oidc-client
          client_secret=ZXhhbXBsZS1hcHAtc2VjcmV0 # notsecret
          curl -v \
            --data '{"audience": ["'$client_id'"], "client_id": "'$client_id'", "client_secret": "'$client_secret'", "grant_types": ["client_credentials"], "token_endpoint_auth_method": "client_secret_basic"}' \
            http://hydra:4445/admin/clients

          # Hydra creates its token signing key on the first token request, and a request
          # that is cancelled aborts the key generation. On slow nodes (for example arm64)
          # that takes longer than the 5s timeout of the collector's oauth2client, so every
          # request of the collector is cancelled, the key never exists and the traces are
          # dropped. Request a token with a generous timeout, so the key exists before the
          # collectors need it.
          for i in $(seq 1 3); do
            if curl -sS --max-time 100 -u "$client_id:$client_secret" \
              -d grant_type=client_credentials -d audience=$client_id \
              http://hydra:4444/oauth2/token | grep -q access_token; then
              exit 0
            fi
            sleep 5
          done
          echo "Hydra did not issue a token"
          exit 1
      restartPolicy: Never
