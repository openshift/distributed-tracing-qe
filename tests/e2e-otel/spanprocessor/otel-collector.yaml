apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: spanprocessor
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}

    exporters:
      debug:
        verbosity: detailed

    processors:
      span:
        name:
          from_attributes: ["db.svc", "operation"]
          separator: "::"
        status:
          code: "Error"
          description: "span processor test error status"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [span]
          exporters: [debug]
