apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redactionprocessor
spec:
  steps:
  - name: Create OTEL collector instance
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Generate and send traces with sensitive and disallowed attributes
    try:
    - apply:
        file: generate-telemetry-data.yaml
    - assert:
        file: generate-telemetry-data-assert.yaml
  - name: Wait for the telemetry data to be collected
    try:
    - sleep:
        duration: 5s
  - name: Check the attributes were masked and redacted
    try:
    - script:
        timeout: 5m
        content: ./check_logs.sh
