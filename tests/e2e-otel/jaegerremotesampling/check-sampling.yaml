apiVersion: batch/v1
kind: Job
metadata:
  name: check-sampling
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: check-sampling
    spec:
      containers:
        - name: check-sampling
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=== per-service strategy (foo) ==="
              curl -sS -f "http://jaegerremotesampling-collector:5778/sampling?service=foo"
              echo
              echo "=== default strategy (unknown-service) ==="
              curl -sS -f "http://jaegerremotesampling-collector:5778/sampling?service=unknown-service"
              echo
      restartPolicy: Never
