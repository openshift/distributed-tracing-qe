apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spanmetricsconnector
spec:
  steps:
  - name: Create OTEL collector instance
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Generate and send traces to the OTEL collector
    try:
    - apply:
        file: generate-telemetry-data.yaml
    - assert:
        file: generate-telemetry-data-assert.yaml
  - name: Wait for the span_metrics connector to flush the aggregated metrics
    try:
    - sleep:
        duration: 10s
  - name: Check the derived R.E.D metrics
    try:
    - script:
        timeout: 5m
        content: ./check_logs.sh
