apiVersion: batch/v1
kind: Job
metadata:
  name: logs-tenant-a
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: logs-tenant-a
    spec:
      containers:
        - name: logs-tenant-a
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.150.0
          command: ["./telemetrygen"]
          args:
            - "--otlp-endpoint=logdedup-collector:4318"
            - "--otlp-http"
            - "--otlp-insecure=true"
            - "--otlp-header=x-scope-orgid=\"tenant-a\""
            - "--logs=5"
            - "--body=duplicate message"
            - "logs"
      restartPolicy: Never

