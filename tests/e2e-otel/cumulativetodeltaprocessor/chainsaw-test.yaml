apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cumulativetodeltaprocessor
spec:
  steps:
  - name: Create OTEL collector instance
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Generate and send a cumulative sum metric to the OTEL collector
    try:
    - apply:
        file: generate-telemetry-data.yaml
    - assert:
        file: generate-telemetry-data-assert.yaml
  - name: Wait for the telemetry data to be collected
    try:
    - sleep:
        duration: 5s
  - name: Check the cumulative sum metric was converted to delta
    try:
    - script:
        timeout: 5m
        content: ./check_logs.sh
