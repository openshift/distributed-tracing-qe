apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: syslogexporter
spec:
  steps:
  - name: Create the syslog sink
    try:
    - apply:
        file: syslog-sink.yaml
    - assert:
        file: syslog-sink-assert.yaml
  - name: Create OTEL collector with the syslog exporters
    try:
    - apply:
        file: otel-collector.yaml
    - assert:
        file: otel-collector-assert.yaml
  - name: Generate logs and send them to the OTEL collector
    try:
    - apply:
        file: generate-logs.yaml
    - assert:
        file: generate-logs-assert.yaml
  - name: Check the syslog messages received by the sink
    try:
    - script:
        timeout: 5m
        content: ./check_syslog.sh
