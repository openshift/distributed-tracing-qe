apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: syslogexporter-injection
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  config:
    receivers:
      otlp:
        protocols:
          http: {}

    processors:
      transform:
        log_statements:
          - context: log
            statements:
              - set(attributes["message"], body.string)
              - set(attributes["appname"], "otel-e2e")
              - set(attributes["hostname"], "e2e-host")

    exporters:
      syslog:
        endpoint: syslog-sink
        port: 5140
        network: tcp
        protocol: rfc5424
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [transform]
          exporters: [syslog]
